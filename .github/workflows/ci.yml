name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(install.sh test/*.sh test/fixtures/*.sh)
          if ((${#files[@]})); then shellcheck "${files[@]}"; fi
      - name: shfmt
        run: shfmt -d -i 2 -ci .

  known-hosts:
    # Fetches github.com host keys from api.github.com/meta and via ssh-keyscan, and checks them against the
    # fingerprints hardcoded in install.sh. Fails if GitHub rotates its keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: known_hosts against the real GitHub
        run: test/run.sh known_hosts
