name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(install.sh test/*.sh test/fixtures/*.sh)
          if ((${#files[@]})); then shellcheck "${files[@]}"; fi
      - name: shfmt
        run: shfmt -d -i 2 -ci .
