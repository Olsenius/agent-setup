name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: shellcheck
        run: shellcheck install.sh test/*.sh test/fixtures/*.sh
      - name: shfmt
        run: shfmt -d -i 2 -ci .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: tests (Linux, default bash)
        if: runner.os == 'Linux'
        run: test/run.sh
      - name: tests (macOS, /bin/bash 3.2 to catch bash 4+ features)
        if: runner.os == 'macOS'
        run: BASH_BIN=/bin/bash /bin/bash test/run.sh

  alpine:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: dependencies
        run: apk add --no-cache bash git openssh-keygen openssh-client curl
      - uses: actions/checkout@v7
      - name: tests (Alpine, as root in a container)
        run: bash test/run.sh

  known-hosts:
    # Fetches github.com host keys from api.github.com/meta and via ssh-keyscan, and checks them against the
    # fingerprints hardcoded in install.sh. Fails if GitHub rotates its keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: known_hosts against the real GitHub
        run: test/run.sh known_hosts
